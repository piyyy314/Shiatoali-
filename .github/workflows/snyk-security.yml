name: Snyk and Independent SAST Security

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read
  security-events: write

jobs:
  check-snyk-token:
    name: Check Snyk credential availability
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check SNYK_TOKEN without exposing its value
        id: check
        shell: bash
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [[ -n "${SNYK_TOKEN:-}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

  snyk:
    name: Snyk vulnerability and code scans
    needs: check-snyk-token
    if: needs.check-snyk-token.outputs.configured == 'true'
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Snyk CLI
        run: npm install --global snyk

      - name: Snyk Open Source test
        id: snyk_open_source
        continue-on-error: true
        run: snyk test --all-projects --severity-threshold=high

      - name: Snyk Code test
        id: snyk_code
        continue-on-error: true
        shell: bash
        run: |
          set +e
          snyk code test --sarif > snyk-code.sarif
          status=$?
          if [[ -s snyk-code.sarif ]]; then
            echo "sarif_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "sarif_exists=false" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

      - name: Upload Snyk Code results
        if: always() && steps.snyk_code.outputs.sarif_exists == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-code.sarif

      - name: Snyk Infrastructure as Code test
        id: snyk_iac
        continue-on-error: true
        run: snyk iac test --severity-threshold=high

      - name: Enforce Snyk scan outcomes
        if: always()
        env:
          OPEN_SOURCE_OUTCOME: ${{ steps.snyk_open_source.outcome }}
          CODE_OUTCOME: ${{ steps.snyk_code.outcome }}
          IAC_OUTCOME: ${{ steps.snyk_iac.outcome }}
        shell: bash
        run: |
          failed=0
          for item in "OPEN_SOURCE:$OPEN_SOURCE_OUTCOME" "CODE:$CODE_OUTCOME" "IAC:$IAC_OUTCOME"; do
            scanner="${item%%:*}"
            outcome="${item#*:}"
            echo "Snyk $scanner: $outcome"
            if [[ "$outcome" != "success" ]]; then
              echo "::error::Snyk $scanner scan did not complete successfully (outcome: $outcome)."
              failed=1
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "Snyk scan is failed or incomplete; it must not be reported as a successful security scan."
            exit 1
          fi
          echo "All configured Snyk scans completed successfully."


  semgrep-fallback:
    name: Semgrep OSS independent SAST fallback
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep OSS
        run: |
          python -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/python" -m pip install --disable-pip-version-check semgrep==1.186.0
          echo "$RUNNER_TEMP/semgrep-venv/bin" >> "$GITHUB_PATH"

      - name: Run independent Semgrep scan
        id: semgrep
        continue-on-error: true
        run: |
          semgrep scan \
            --config p/python \
            --config p/javascript \
            --config p/security-audit \
            --metrics=off \
            --timeout 60 \
            --json --output semgrep-report.json \
            --exclude node_modules --exclude deps --exclude _build --exclude priv/static \
            .

      - name: Enforce Semgrep report and high-severity findings
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.semgrep.outcome }}
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path("semgrep-report.json")
          if not path.is_file():
              print("Semgrep report missing; fallback scan is incomplete.", file=sys.stderr)
              sys.exit(1)
          try:
              report = json.loads(path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as exc:
              print(f"Semgrep report unavailable or invalid: {exc}", file=sys.stderr)
              sys.exit(1)
          errors = report.get("errors") or []
          if errors:
              for error in errors:
                  print(f"Semgrep scan error: {error}", file=sys.stderr)
              sys.exit(1)
          findings = report.get("results")
          if not isinstance(findings, list):
              print("Semgrep report has no results list.", file=sys.stderr)
              sys.exit(1)

          def high_or_critical(item):
              extra = item.get("extra") or {}
              metadata = extra.get("metadata") or {}
              severity = str(extra.get("severity", "")).upper()
              raw_score = metadata.get("security-severity", 0)
              severity_label = str(raw_score).upper()
              try:
                  score = float(raw_score)
              except (TypeError, ValueError):
                  score = 0
              return severity == "ERROR" or severity_label in {"HIGH", "CRITICAL"} or score >= 7.0

          high = [item for item in findings if high_or_critical(item)]
          print(f"Semgrep completed: {len(findings)} findings, {len(high)} high/critical.")
          for item in high:
              extra = item.get("extra") or {}
              print(f"HIGH: {item.get('path')}:{item.get('start', {}).get('line')} {item.get('check_id')} — {extra.get('message', '')}")
          if high:
              sys.exit(1)
          if "${SCAN_OUTCOME}" != "success":
              print("Semgrep scanner did not complete successfully.", file=sys.stderr)
              sys.exit(1)
          print("Semgrep OSS fallback completed without high/critical findings.")
          PY

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-oss-report
          path: semgrep-report.json
          if-no-files-found: warn
          retention-days: 7

  snyk-not-configured:
    name: Snyk scan unavailable (credential missing)
    needs: check-snyk-token
    if: needs.check-snyk-token.outputs.configured != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report explicit skipped status
        shell: bash
        run: |
          echo "::warning::Snyk scans were skipped because the SNYK_TOKEN repository secret is not configured."
          {
            echo "## Snyk security scan: SKIPPED"
            echo ""
            echo "No Snyk Open Source, Code, or IaC scan was performed because SNYK_TOKEN is unavailable."
            echo "This is not a successful scan. Configure the secret or use the documented alternative scanner."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
