name: Snyk Security

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read
  security-events: write

jobs:
  check-snyk-token:
    name: Check Snyk credential availability
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check SNYK_TOKEN without exposing its value
        id: check
        shell: bash
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [[ -n "${SNYK_TOKEN:-}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

  snyk:
    name: Snyk vulnerability and code scans
    needs: check-snyk-token
    if: needs.check-snyk-token.outputs.configured == 'true'
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Snyk CLI
        run: npm install --global snyk

      - name: Snyk Open Source test
        id: snyk_open_source
        continue-on-error: true
        run: snyk test --all-projects --severity-threshold=high

      - name: Snyk Code test
        id: snyk_code
        continue-on-error: true
        shell: bash
        run: |
          set +e
          snyk code test --sarif > snyk-code.sarif
          status=$?
          if [[ -s snyk-code.sarif ]]; then
            echo "sarif_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "sarif_exists=false" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

      - name: Upload Snyk Code results
        if: always() && steps.snyk_code.outputs.sarif_exists == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-code.sarif

      - name: Snyk Infrastructure as Code test
        id: snyk_iac
        continue-on-error: true
        run: snyk iac test --severity-threshold=high

      - name: Enforce Snyk scan outcomes
        if: always()
        env:
          OPEN_SOURCE_OUTCOME: ${{ steps.snyk_open_source.outcome }}
          CODE_OUTCOME: ${{ steps.snyk_code.outcome }}
          IAC_OUTCOME: ${{ steps.snyk_iac.outcome }}
        shell: bash
        run: |
          failed=0
          for scanner in OPEN_SOURCE CODE IAC; do
            outcome="${!scanner`_OUTCOME}"
            echo "Snyk ${scanner}: ${outcome:-not-run}"
            if [[ "$outcome" != "success" ]]; then
              echo "::error::Snyk ${scanner} scan did not complete successfully (outcome: ${outcome:-not-run})."
              failed=1
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "Snyk scan is failed or incomplete; it must not be reported as a successful security scan."
            exit 1
          fi
          echo "All configured Snyk scans completed successfully."

  snyk-not-configured:
    name: Snyk scan unavailable (credential missing)
    needs: check-snyk-token
    if: needs.check-snyk-token.outputs.configured != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report explicit skipped status
        shell: bash
        run: |
          echo "::warning::Snyk scans were skipped because the SNYK_TOKEN repository secret is not configured."
          {
            echo "## Snyk security scan: SKIPPED"
            echo ""
            echo "No Snyk Open Source, Code, or IaC scan was performed because SNYK_TOKEN is unavailable."
            echo "This is not a successful scan. Configure the secret or use the documented alternative scanners."
          } >> "$GITHUB_STEP_SUMMARY"
