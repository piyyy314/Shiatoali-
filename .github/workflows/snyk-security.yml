name: Snyk Security
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
permissions:
  contents: read
  security-events: write
jobs:
  snyk:
    name: Snyk vulnerability and code scans
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Check Snyk token
        id: token
        shell: bash
        run: |
          if [[ -n "${SNYK_TOKEN:-}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Snyk scans skipped because the SNYK_TOKEN repository secret is not configured."
          fi

      - name: Checkout repository
        if: steps.token.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.token.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Snyk CLI
        if: steps.token.outputs.configured == 'true'
        run: npm install --global snyk

      - name: Snyk Open Source test
        if: steps.token.outputs.configured == 'true'
        continue-on-error: true
        run: snyk test --all-projects --severity-threshold=high

      - name: Snyk Code test
        id: snyk_code
        if: steps.token.outputs.configured == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          snyk code test --sarif > snyk-code.sarif
          status=$?
          if [[ -s snyk-code.sarif ]]; then
            echo "sarif_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "sarif_exists=false" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

      - name: Upload Snyk Code results
        if: steps.snyk_code.outputs.sarif_exists == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-code.sarif

      - name: Snyk Infrastructure as Code test
        if: steps.token.outputs.configured == 'true'
        continue-on-error: true
        run: snyk iac test --severity-threshold=high
